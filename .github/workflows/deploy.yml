# TimeKeep Web — CD: deploy to Cloudflare from GitHub.
#
# Two ways to deploy:
#   1. Actions → Deploy → Run workflow (manual, any time)
#   2. push a vX.Y.Z tag — releases deploy automatically
#
# The tag glob is guarded twice against dev versions (x.y.z.devN must never
# deploy): the `!v*.dev*` exclusion below, and scripts/check-release-tag.mjs
# failing the run when the tagged commit's package.json isn't a clean x.y.z
# matching the tag.
#
# A deploy is GATED on a successful full CI run (lint · format · typecheck ·
# unit · e2e/security) for the exact sha being deployed — see the ci-gate job.
# A tag push starts both workflows at once, so the gate waits for CI rather than
# assuming it already passed.
#
# One-time setup (details in docs/deployment.md → "Deploying from GitHub"):
#   Secrets:   CLOUDFLARE_API_TOKEN (scoped: Workers Scripts Edit, D1 Edit,
#              Workers KV Storage Edit), CLOUDFLARE_ACCOUNT_ID
#              (optionally TURNSTILE_SECRET_KEY / RESEND_API_KEY)
#   Variables: CF_D1_DATABASE_ID, CF_KV_NAMESPACE_ID, CF_DEPLOY_URL,
#              CF_APP_PUBLIC_URL (canonical origin for reset/verification links)
#   Environment "production": add required reviewers for an approval gate.
#
# The deploy config is rendered from the committed wrangler.jsonc template at
# run time (scripts/render-wrangler.mjs) — resource ids never live in the repo.
name: Deploy

on:
  workflow_dispatch:
  push:
    tags: ['v*', '!v*.dev*', '!v*-dev*']

permissions:
  contents: read
  # the ci-gate job reads this repo's check runs
  checks: read

concurrency:
  group: production
  cancel-in-progress: false # queue deploys — never cancel one mid-run

jobs:
  # INV-07: no successful full validation → no production deploy.
  #
  # This used to be a bare `npm run typecheck && npm test` inside the deploy
  # job, which is a WEAKER gate than the CI workflow: it skipped lint,
  # format:check and — the important one — the whole e2e/security suite, so a
  # release could ship with a failing E2E or security probe and still deploy.
  # The invariant is about the exact sha, so the check is on the sha, not on
  # "some CI run is green somewhere".
  #
  # A tag push starts CI and this workflow at the same moment, so the gate
  # POLLS rather than looking once — a failure here means "CI has not finished
  # for this sha (or failed)", and the message says which.
  ci-gate:
    name: ci-gate (full CI must be green for this sha)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      conclusion: ${{ steps.check.outputs.conclusion }}
      url: ${{ steps.check.outputs.url }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          # the e2e job is the long pole (wrangler dev, ~10 min plus a retry)
          WAIT_SECONDS: '1500'
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + WAIT_SECONDS ))
          while :; do
            # `check_runs` is keyed by sha and reports per-job conclusions,
            # which is what we need: the workflow-level conclusion alone would
            # accept a run whose jobs are still in progress.
            json=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100")
            conclusion=$(echo "$json" | jq -r '
              [.check_runs[]
                | select(.name | test("^(verify|version-sync|e2e)"))
                | .status + ":" + (.conclusion // "null")] | join(" ")')
            url=$(echo "$json" | jq -r '[.check_runs[] | select(.name == "verify") | .html_url][0] // ""')
            echo "check runs: $conclusion"
            if [ "$conclusion" = "completed:success completed:success completed:success" ]; then
              echo "gate: full CI is green for $SHA"
              echo "conclusion=success" >> "$GITHUB_OUTPUT"
              [ -n "$url" ] && echo "url=$url" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # nothing at all for this sha: CI was never run for it. A manual
            # dispatch of this workflow from a ref that has no CI run is a
            # supported path (hotfix), so say exactly what to do instead of
            # burning the whole wait.
            if [ -z "$conclusion" ]; then
              echo "::error::no CI check runs found for $SHA — run the CI workflow for this exact commit first (Actions → CI → Run workflow, ref $GITHUB_REF_NAME), then deploy."
              echo "conclusion=no-ci" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            # anything explicitly failed or cancelled will not recover
            if echo "$conclusion" | grep -Eq "completed:(failure|cancelled|timed_out|action_required|neutral|stale)"; then
              echo "::error::CI did not pass for $SHA ($conclusion) — see $url"
              echo "conclusion=failure" >> "$GITHUB_OUTPUT"
              [ -n "$url" ] && echo "url=$url" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::timed out waiting for CI on $SHA ($conclusion) — see $url"
              echo "conclusion=timeout" >> "$GITHUB_OUTPUT"
              [ -n "$url" ] && echo "url=$url" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            sleep 30
          done

  deploy:
    name: deploy (migrate → deploy → verify)
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      # release discipline: fail before anything runs if the tag is a dev
      # version (x.y.z.devN) or doesn't match the tagged commit's package.json
      - name: Guard release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/check-release-tag.mjs
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Fast local sanity only — the AUTHORITATIVE gate is the ci-gate job
      # above, which requires the full CI suite (lint · format · typecheck ·
      # unit · e2e/security) to have passed for this exact sha. This step is here
      # so the deploy job is not building from a tree it has not compiled.
      - name: Local sanity (the full gate ran in ci-gate)
        run: |
          npm run lint
          npm run format:check
          npm run typecheck
          npm test

      # audit #4: verifyTurnstile() returns true when the secret is absent, so a
      # deployment without it silently has no bot defense on the auth endpoints.
      # Non-blocking by design (Turnstile is optional and secrets set directly
      # on the worker survive redeploys without living in the repo) — this only
      # surfaces the most likely cause.
      - name: Warn if Turnstile is unconfigured
        run: |
          if [ -z "${TURNSTILE_SECRET_KEY}" ]; then
            echo "::warning::No TURNSTILE_SECRET_KEY secret in this repo — verifyTurnstile() no-ops without it, so login/reset/verify have NO bot defense. If it was set directly on the worker (wrangler secret put, survives redeploys) ignore this; otherwise set it."
          else
            echo "Turnstile secret present in the repo — bot defense will be active."
          fi
        env:
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}

      # audit #5: reset/verification emails carry a bearer token, so their
      # origin is deployment configuration (APP_PUBLIC_URL), never the request's
      # — a spoofable Host header would aim the token at another domain
      # (src/shared/public-url.ts, INV-09). Non-blocking, like the Turnstile
      # warning: the Worker still works, it just derives the origin per request.
      - name: Warn if APP_PUBLIC_URL is unconfigured
        run: |
          if [ -z "$APP_PUBLIC_URL" ]; then
            echo "::warning::APP_PUBLIC_URL is not set — password-reset/verification links fall back to the REQUEST origin, so a Host header this deployment accepts could aim the token at another domain. Set it as a repo variable (or environment variable) to the canonical https origin."
          else
            echo "APP_PUBLIC_URL present: secret links will use $APP_PUBLIC_URL"
          fi
        env:
          APP_PUBLIC_URL: ${{ vars.CF_APP_PUBLIC_URL }}

      - name: Render deploy config (ids stay out of the repo)
        run: BUILD_SHA="${GITHUB_SHA::7}" node scripts/render-wrangler.mjs wrangler.ci.jsonc
        env:
          D1_DATABASE_ID: ${{ vars.CF_D1_DATABASE_ID }}
          KV_NAMESPACE_ID: ${{ vars.CF_KV_NAMESPACE_ID }}
          APP_PUBLIC_URL: ${{ vars.CF_APP_PUBLIC_URL }}

      - run: npm run build

      # additive-by-policy migrations, applied before the code switch;
      # idempotent (wrangler tracks applied migrations)
      - name: D1 migrations (remote)
        run: npx wrangler d1 migrations apply timekeep --remote -c wrangler.ci.jsonc

      - name: Deploy
        run: npx wrangler deploy -c wrangler.ci.jsonc

      - name: Verify /api/version
        run: |
          resp=$(curl -fsS "$CF_DEPLOY_URL/api/version")
          echo "$resp"
          version=$(node -p 'require("./package.json").version')
          echo "$resp" | jq -e --arg v "$version" --arg s "${GITHUB_SHA::7}" \
            '.name == "timekeep-web" and .version == $v and .build == $s' > /dev/null
          echo "live: version $version, build ${GITHUB_SHA::7}"
        env:
          CF_DEPLOY_URL: ${{ vars.CF_DEPLOY_URL }}
